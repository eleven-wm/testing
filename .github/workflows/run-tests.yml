name: Run Python Tests

# 触发条件：每次推送代码或发起 Pull Request 时自动运行
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 第 1 步：拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 第 2 步：设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 第 3 步：安装依赖（pytest）
      - name: Install dependencies
        run: pip install pytest

      # 第 4 步：运行测试
      - name: Run tests
        run: pytest content/code/python/example_experiment.py -v
